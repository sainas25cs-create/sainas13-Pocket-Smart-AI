<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PocketSmartAI - Login</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<nav>

    <div class="logo">
        🟧 Pocket<span>SmartAI</span>
    </div>

    <div class="nav-links">

        <a href="/">Home</a>

        <a href="/register">
            Register
        </a>

    </div>

</nav>


<main class="auth-page">

    <div class="auth-card">

        <h1>
            Welcome Back
        </h1>

        <p>
            Login to continue using PocketSmartAI.
        </p>


        {% if error %}
        <div class="alert alert-error">
            {{ error }}
        </div>
        {% endif %}


        <form action="/login" method="post">

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button type="submit" class="btn">
                Login
            </button>

        </form>


        <p style="margin-top: 22px; margin-bottom: 0;">

            Don't have an account?

            <a
                href="/register"
                style="color:#1689d8; font-weight:700;"
            >
                Create Account
            </a>

        </p>

    </div>

</main>


<footer>

    <h3>
        🟧 PocketSmartAI
    </h3>

    <p>
        Smart ideas for everyday life.
    </p>

    <p>
        © 2026 PocketSmartAI. All rights reserved.
    </p>

</footer>


</body>
</html>
