{% extends "base.html" %}


{% block title %}
Register — PocketSmart AI
{% endblock %}


{% block content %}

<main class="container">

    <div class="card auth-card">

        <h1>
            Create Account
        </h1>

        <p class="muted">
            Create your PocketSmart AI account.
        </p>


        <form id="registerForm">

            <label for="name">
                Name
            </label>

            <input
                id="name"
                name="name"
                type="text"
                minlength="2"
                required
            >


            <label for="email">
                Email
            </label>

            <input
                id="email"
                name="email"
                type="email"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                id="password"
                name="password"
                type="password"
                minlength="6"
                required
            >


            <p
                id="message"
                class="error"
            ></p>


            <button type="submit">
                Create Account
            </button>

        </form>


        <p>

            Already have an account?

            <a href="/login">
                Login
            </a>

        </p>

    </div>

</main>

{% endblock %}


{% block scripts %}

<script>

const form =
    document.getElementById(
        "registerForm"
    );

const message =
    document.getElementById(
        "message"
    );


form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        message.textContent = "";

        try {

            const data =
                Object.fromEntries(
                    new FormData(form)
                );

            const response =
                await api(
                    "/api/auth/register",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(data)
                    }
                );

            localStorage.setItem(
                "token",
                response.access_token
            );

            window.location.href =
                "/dashboard";

        } catch (error) {

            message.textContent =
                error.message;

        }

    }
);

</script>

{% endblock %}
